<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Companion</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f0f14;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 22px 18px;
      border-bottom: 1px solid #292933;
      background: #15151d;
    }

    header h1 {
      font-size: 26px;
    }

    header p {
      color: #aaa;
      margin-top: 5px;
    }

    #characters {
      padding: 22px 16px;
    }

    #characters h2 {
      margin-bottom: 18px;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .character-card {
      background: #1d1d27;
      border: 1px solid #30303d;
      border-radius: 18px;
      padding: 22px 12px;
      text-align: center;
      cursor: pointer;
    }

    .character-card:active {
      transform: scale(0.97);
    }

    .avatar {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      background: linear-gradient(135deg, #7b2cff, #d633ff);
    }
.avatar img {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}
    .character-card h3 {
      margin-top: 12px;
      font-size: 19px;
    }

    .character-card p {
      margin-top: 6px;
      color: #aaa;
      font-size: 14px;
    }

    #chatScreen {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      background: #17171f;
      border-bottom: 1px solid #292933;
    }

    .back {
      font-size: 26px;
      cursor: pointer;
    }

    .small-avatar {
      font-size: 30px;
    }

    .chat-header p {
      color: #9b9b9b;
      font-size: 13px;
      margin-top: 3px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px 100px;
    }

    .message {
      max-width: 80%;
      padding: 13px 16px;
      border-radius: 18px;
      margin-bottom: 13px;
      line-height: 1.4;
    }

    .ai {
      background: #22222d;
      margin-right: auto;
    }

    .user {
      background: linear-gradient(135deg, #7627ff, #9b32ff);
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #17171f;
      border-top: 1px solid #292933;
    }

    #messageInput {
      flex: 1;
      border: none;
      outline: none;
      border-radius: 24px;
      padding: 13px 16px;
      background: #292934;
      color: white;
      font-size: 16px;
    }

    #sendButton {
      border: none;
      border-radius: 24px;
      padding: 0 18px;
      background: #8433ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div id="characterScreen">

    <header>
      <h1>✨ AI Companion</h1>
      <p>Choose someone to talk with</p>
    </header>

    <section id="characters">

      <h2>Choose your companion</h2>

      <div class="character-grid">

        <div class="character-card"
            onclick="selectCharacter('Luna','file_000000003bd081fa8f256ed2c21d7641.png','Friendly, nude body showing, sexy chat to wound with love & caring')">
          <div class="avatar"><img src="file_000000003bd081fa8f256ed2c21d7641.png" alt="Luna"></div>
          <h3>Luna</h3>
          <p>Friendly & caring</p>
        </div>

        <div class="character-card"
             onclick="selectCharacter('Maya','file_00000000b5f48211a190dc094c6334bc.png','Fun, sexy and nude & energetic')">
          <div class="avatar"><img src="file_00000000b5f48211a190dc094c6334bc.png" alt="Maya"></div>
          <h3>Maya</h3>
          <p>Fun & energetic</p>
        </div>

        <div class="character-card"
             onclick="selectCharacter('Sophia','👩‍💼','Smart, sexy & thoughtful')">
          <div class="avatar">👩‍💼</div>
          <h3>Sophia</h3>
          <p>Smart & thoughtful</p>
        </div>

        <div class="character-card"
             onclick="selectCharacter('Aria','👩‍🎤','Creative & playful')">
          <div class="avatar">👩‍🎤</div>
          <h3>Aria</h3>
          <p>Creative & playful</p>
        </div>

      </div>
    </section>
  </div>

  <div id="chatScreen">

    <div class="chat-header">

      <div class="back" onclick="goBack()">←</div>

      <div class="small-avatar" id="chatAvatar">👩</div>

      <div>
        <strong id="chatName">Luna</strong>
        <p id="chatPersonality">Friendly & caring</p>
      </div>

    </div>

    <div id="messages"></div>

    <div class="input-area">

      <input
        id="messageInput"
        placeholder="Type a message..."
        onkeydown="handleKey(event)"
      >

      <button id="sendButton" onclick="sendMessage()">
        Send
      </button>

    </div>
  </div>

<script>

  let currentCharacter = "Luna";

  function selectCharacter(name, avatar, nude, personality) {

    currentCharacter = name;

    document.getElementById("characterScreen").style.display = "none";
    document.getElementById("chatScreen").style.display = "flex";

    document.getElementById("chatName").textContent = name;
    document.getElementById("chatAvatar").innerHTML = '<img src="' + avatar + '" alt="' + name + '" style="width:50px;height:50px;border-radius:50%;object-fit:cover;">';
    document.getElementById("chatPersonality").textContent = personality;

    const messages = document.getElementById("messages");
    messages.innerHTML = "";

    addMessage(
      "Hi! 👋 I'm " + name + ". It's nice to meet you. How are you feeling today?",
      "ai"
    );
  }

  function goBack() {

    document.getElementById("chatScreen").style.display = "none";
    document.getElementById("characterScreen").style.display = "block";
  }

  function addMessage(text, type) {

    const messages = document.getElementById("messages");

    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;

    messages.appendChild(message);
    messages.scrollTop = messages.scrollHeight;
  }

  async function sendMessage() {

    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    try {

      const response = await fetch(
        "https://ai-companion-1-ie8w.onrender.com/chat",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text,
            character: currentCharacter
          })
        }
      );

      const data = await response.json();

      addMessage(
        data.reply || "Sorry, I couldn't reply right now.",
        "ai"
      );

    } catch (error) {

      addMessage(
        "Connection problem. Please try again.",
        "ai"
      );
    }
  }

  function handleKey(event) {

    if (event.key === "Enter") {
      sendMessage();
    }
  }

</script>

</body>
</html>
